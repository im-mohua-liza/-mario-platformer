<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Super Square Adventure - Mobile Controls</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    body {
      margin: 0;
      background: #111;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: sans-serif;
      padding: 10px;
    }

    canvas {
      border: 4px solid #000;
      background: linear-gradient(to bottom, #74b9ff, #a29bfe);
      display: block;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      max-width: 100%;
      height: auto;
    }

    /* TOUCH CONTROLS */
    #touchControls {
      width: 800px;
      max-width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 14px;
      gap: 12px;
      user-select: none;
    }

    .touch-btn {
      flex: 1;
      height: 80px;
      border: none;
      border-radius: 18px;
      font-size: 28px;
      font-weight: bold;
      color: white;
      background: #333;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
      cursor: pointer;
    }

    .touch-btn:active {
      transform: scale(0.96);
      background: #555;
    }

    #jumpBtn {
      background: #e67e22;
    }

    #leftBtn,
    #rightBtn {
      background: #2980b9;
    }

    @media (min-width: 900px) and (pointer: fine) {
      .touch-btn {
        opacity: 0.85;
      }
    }
  </style>
</head>
<body>

<canvas id="gameCanvas" width="800" height="500"></canvas>

<!-- TOUCH CONTROLS -->
<div id="touchControls">
  <button class="touch-btn" id="leftBtn">◀ LEFT</button>
  <button class="touch-btn" id="jumpBtn">▲ JUMP</button>
  <button class="touch-btn" id="rightBtn">RIGHT ▶</button>
</div>

<script>
  const canvas = document.getElementById("gameCanvas");
  const ctx = canvas.getContext("2d");

  // Canvas dimensions
  const WIDTH = canvas.width;
  const HEIGHT = canvas.height;

  // World size
  const WORLD_WIDTH = 3200;

  // Game states
  let gameState = "START";

  // Score/lives
  let score = 0;
  let lives = 3;

  // Ground
  const groundHeight = 40;
  const groundY = HEIGHT - groundHeight;

  // Camera
  const camera = {
    x: 0
  };

  // Goal flag
  const goalFlag = {
    x: 3100,
    y: groundY - 200,
    poleWidth: 8,
    poleHeight: 200,
    flagWidth: 40,
    flagHeight: 30
  };

  // Platforms
  const platforms = [
    { x: 200, y: 380, width: 120, height: 20 },
    { x: 400, y: 300, width: 120, height: 20 },
    { x: 600, y: 220, width: 120, height: 20 },
    { x: 900, y: 380, width: 120, height: 20 },
    { x: 1100, y: 320, width: 120, height: 20 },
    { x: 1300, y: 260, width: 120, height: 20 },
    { x: 1500, y: 320, width: 200, height: 20 },
    { x: 1800, y: 400, width: 100, height: 20 },
    { x: 2000, y: 320, width: 100, height: 20 },
    { x: 2200, y: 250, width: 100, height: 20 },
    { x: 2500, y: 350, width: 200, height: 20 },
    { x: 2800, y: 280, width: 150, height: 20 }
  ];

  // Clouds
  const clouds = [
    { x: 150, y: 80, size: 30 },
    { x: 450, y: 50, size: 40 },
    { x: 800, y: 90, size: 25 },
    { x: 1200, y: 60, size: 35 },
    { x: 1600, y: 100, size: 45 },
    { x: 2000, y: 40, size: 30 },
    { x: 2400, y: 75, size: 35 },
    { x: 2800, y: 60, size: 40 }
  ];

  // Hills
  const backgroundHills = [
    { x: 100, cx: 350, r: 240 },
    { x: 650, cx: 900, r: 280 },
    { x: 1300, cx: 1600, r: 260 },
    { x: 2000, cx: 2350, r: 310 },
    { x: 2650, cx: 3000, r: 250 }
  ];

  // Player start
  const PLAYER_START_X = 100;
  const PLAYER_START_Y = groundY - 40;

  // Player
  const player = {
    x: PLAYER_START_X,
    y: PLAYER_START_Y,
    width: 40,
    height: 40,
    color: "#ff2a2a",

    velocityY: 0,
    speed: 5,
    jumpStrength: 13.5,
    gravity: 0.6,

    isJumping: false
  };

  // Arrays
  let enemies = [];
  let coins = [];

  // Audio
  let audioCtx = null;

  function initAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    if (audioCtx.state === "suspended") {
      audioCtx.resume();
    }
  }

  function simpleBeep(freq, duration, type="triangle", volume=0.15) {
    if (!audioCtx) return;

    const now = audioCtx.currentTime;

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = type;
    osc.frequency.setValueAtTime(freq, now);

    gain.gain.setValueAtTime(volume, now);
    gain.gain.linearRampToValueAtTime(0.01, now + duration);

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start(now);
    osc.stop(now + duration);
  }

  function playJumpSound() {
    simpleBeep(300, 0.1);
  }

  function playCoinSound() {
    simpleBeep(900, 0.2, "sine", 0.12);
  }

  function playStompSound() {
    simpleBeep(120, 0.15);
  }

  function playDeathSound() {
    simpleBeep(80, 0.25, "square");
  }

  function playWinSound() {
    simpleBeep(523, 0.15);
    setTimeout(() => simpleBeep(659, 0.15), 120);
    setTimeout(() => simpleBeep(784, 0.2), 240);
  }

  // Reset game
  function resetGame() {

    score = 0;
    lives = 3;

    player.x = PLAYER_START_X;
    player.y = PLAYER_START_Y;
    player.velocityY = 0;
    player.isJumping = false;

    camera.x = 0;

    enemies = [
      { startX: 300, x: 300, y: groundY - 32, width: 32, height: 32, speed: 1.5, direction: 1, patrolRange: 150, color: "#4a2711" },
      { startX: 550, x: 550, y: groundY - 32, width: 32, height: 32, speed: 1.5, direction: -1, patrolRange: 150, color: "#4a2711" },
      { startX: 1000, x: 1000, y: groundY - 32, width: 32, height: 32, speed: 1.5, direction: 1, patrolRange: 150, color: "#4a2711" },
      { startX: 1600, x: 1600, y: groundY - 32, width: 32, height: 32, speed: 1.5, direction: 1, patrolRange: 150, color: "#4a2711" },
      { startX: 2100, x: 2100, y: groundY - 32, width: 32, height: 32, speed: 1.5, direction: 1, patrolRange: 150, color: "#4a2711" },
      { startX: 2700, x: 2700, y: groundY - 32, width: 32, height: 32, speed: 1.5, direction: 1, patrolRange: 150, color: "#4a2711" }
    ];

    coins = [
      { x: 260, y: 350, size: 20 },
      { x: 310, y: 350, size: 20 },
      { x: 450, y: 270, size: 20 },
      { x: 500, y: 270, size: 20 },
      { x: 650, y: 190, size: 20 },
      { x: 700, y: 190, size: 20 }
    ];
  }

  // Controls
  const keys = {
    left: false,
    right: false
  };

  // Jump helper
  function attemptJump() {

    if (gameState === "START") {
      gameState = "PLAYING";
      return;
    }

    if (gameState === "GAME_OVER" || gameState === "WON") {
      resetGame();
      gameState = "PLAYING";
      return;
    }

    if (!player.isJumping) {
      player.velocityY = -player.jumpStrength;
      player.isJumping = true;
      playJumpSound();
    }
  }

  // Keyboard
  window.addEventListener("keydown", (e) => {

    initAudio();

    if (e.code === "ArrowLeft") {
      keys.left = true;
    }

    if (e.code === "ArrowRight") {
      keys.right = true;
    }

    if (e.code === "Space") {
      e.preventDefault();
      attemptJump();
    }
  });

  window.addEventListener("keyup", (e) => {

    if (e.code === "ArrowLeft") {
      keys.left = false;
    }

    if (e.code === "ArrowRight") {
      keys.right = false;
    }

    if (e.code === "Space") {
      if (player.velocityY < -3) {
        player.velocityY = -3;
      }
    }
  });

  // TOUCH CONTROLS
  const leftBtn = document.getElementById("leftBtn");
  const rightBtn = document.getElementById("rightBtn");
  const jumpBtn = document.getElementById("jumpBtn");

  function bindHoldButton(button, onPress, onRelease) {

    button.addEventListener("touchstart", (e) => {
      e.preventDefault();
      initAudio();
      onPress();
    });

    button.addEventListener("touchend", (e) => {
      e.preventDefault();
      onRelease();
    });

    button.addEventListener("touchcancel", (e) => {
      e.preventDefault();
      onRelease();
    });

    // Mouse fallback
    button.addEventListener("mousedown", (e) => {
      e.preventDefault();
      initAudio();
      onPress();
    });

    button.addEventListener("mouseup", onRelease);
    button.addEventListener("mouseleave", onRelease);
  }

  bindHoldButton(
    leftBtn,
    () => keys.left = true,
    () => keys.left = false
  );

  bindHoldButton(
    rightBtn,
    () => keys.right = true,
    () => keys.right = false
  );

  bindHoldButton(
    jumpBtn,
    () => attemptJump(),
    () => {
      if (player.velocityY < -3) {
        player.velocityY = -3;
      }
    }
  );

  function handlePlayerDeath() {

    playDeathSound();

    lives--;

    if (lives <= 0) {
      lives = 0;
      gameState = "GAME_OVER";
    }
    else {
      player.x = PLAYER_START_X;
      player.y = PLAYER_START_Y;
      player.velocityY = 0;
      player.isJumping = false;
    }
  }

  // UPDATE
  function update() {

    if (gameState !== "PLAYING") return;

    // Movement
    if (keys.left) {
      player.x -= player.speed;
    }

    if (keys.right) {
      player.x += player.speed;
    }

    // Bounds
    if (player.x < 0) {
      player.x = 0;
    }

    if (player.x + player.width > WORLD_WIDTH) {
      player.x = WORLD_WIDTH - player.width;
    }

    // Previous Y
    const previousY = player.y;

    // Gravity
    player.velocityY += player.gravity;
    player.y += player.velocityY;

    // Ground collision
    if (player.y + player.height >= groundY) {

      player.y = groundY - player.height;
      player.velocityY = 0;
      player.isJumping = false;
    }

    // Platform collisions
    for (const platform of platforms) {

      const horizontalOverlap =
        player.x + player.width > platform.x &&
        player.x < platform.x + platform.width;

      const wasAbovePlatform =
        previousY + player.height <= platform.y;

      const fallingOntoPlatform =
        player.y + player.height >= platform.y;

      if (
        horizontalOverlap &&
        wasAbovePlatform &&
        fallingOntoPlatform &&
        player.velocityY >= 0
      ) {
        player.y = platform.y - player.height;
        player.velocityY = 0;
        player.isJumping = false;
      }
    }

    // Goal
    const touchingGoal =
      player.x + player.width > goalFlag.x &&
      player.x < goalFlag.x + goalFlag.poleWidth &&
      player.y + player.height > goalFlag.y &&
      player.y < goalFlag.y + goalFlag.poleHeight;

    if (touchingGoal) {
      gameState = "WON";
      playWinSound();
    }

    // Enemies
    for (let i = enemies.length - 1; i >= 0; i--) {

      const enemy = enemies[i];

      enemy.x += enemy.speed * enemy.direction;

      const distance = enemy.x - enemy.startX;

      if (distance >= enemy.patrolRange) {
        enemy.direction = -1;
      }

      if (distance <= -enemy.patrolRange) {
        enemy.direction = 1;
      }

      const touchingEnemy =
        player.x + player.width > enemy.x &&
        player.x < enemy.x + enemy.width &&
        player.y + player.height > enemy.y &&
        player.y < enemy.y + enemy.height;

      if (touchingEnemy) {

        const wasAboveEnemy =
          previousY + player.height <= enemy.y;

        if (wasAboveEnemy && player.velocityY >= 0) {

          enemies.splice(i, 1);

          score += 200;

          player.y = enemy.y - player.height;
          player.velocityY = -8;
          player.isJumping = true;

          playStompSound();
        }
        else {
          handlePlayerDeath();
        }
      }
    }

    // Coins
    for (let i = coins.length - 1; i >= 0; i--) {

      const coin = coins[i];

      const touchingCoin =
        player.x + player.width > coin.x &&
        player.x < coin.x + coin.size &&
        player.y + player.height > coin.y &&
        player.y < coin.y + coin.size;

      if (touchingCoin) {

        coins.splice(i, 1);

        score += 100;

        playCoinSound();
      }
    }

    // Camera
    camera.x = player.x - WIDTH / 2 + player.width / 2;

    if (camera.x < 0) {
      camera.x = 0;
    }

    if (camera.x > WORLD_WIDTH - WIDTH) {
      camera.x = WORLD_WIDTH - WIDTH;
    }
  }

  // DRAW
  function draw() {

    ctx.clearRect(0, 0, WIDTH, HEIGHT);

    // Clouds
    ctx.fillStyle = "rgba(255,255,255,0.75)";

    for (const cloud of clouds) {

      const cx = cloud.x - camera.x;

      ctx.beginPath();
      ctx.arc(cx, cloud.y, cloud.size, 0, Math.PI * 2);
      ctx.arc(cx + cloud.size * 0.6, cloud.y - cloud.size * 0.4, cloud.size * 0.8, 0, Math.PI * 2);
      ctx.arc(cx + cloud.size * 1.2, cloud.y, cloud.size * 0.7, 0, Math.PI * 2);
      ctx.fill();
    }

    // Hills
    ctx.fillStyle = "#27ae60";

    const parallax = camera.x * 0.5;

    for (const hill of backgroundHills) {

      ctx.beginPath();
      ctx.arc(hill.cx - parallax, groundY + 80, hill.r, 0, Math.PI * 2);
      ctx.fill();
    }

    // Platforms
    for (const platform of platforms) {

      const px = platform.x - camera.x;

      ctx.fillStyle = "#8a5429";
      ctx.fillRect(px, platform.y, platform.width, platform.height);

      ctx.fillStyle = "#5c3414";
      ctx.fillRect(px, platform.y + platform.height - 6, platform.width, 6);
    }

    // Ground
    ctx.fillStyle = "#6d3e1a";
    ctx.fillRect(-camera.x, groundY, WORLD_WIDTH, groundHeight);

    ctx.fillStyle = "#2ecc71";
    ctx.fillRect(-camera.x, groundY, WORLD_WIDTH, 8);

    // Goal
    ctx.fillStyle = "#4a2f13";

    ctx.fillRect(
      goalFlag.x - camera.x,
      goalFlag.y,
      goalFlag.poleWidth,
      goalFlag.poleHeight
    );

    ctx.fillStyle = "#e74c3c";

    ctx.beginPath();
    ctx.moveTo(goalFlag.x - camera.x + goalFlag.poleWidth, goalFlag.y);
    ctx.lineTo(goalFlag.x - camera.x + goalFlag.poleWidth + goalFlag.flagWidth, goalFlag.y + goalFlag.flagHeight / 2);
    ctx.lineTo(goalFlag.x - camera.x + goalFlag.poleWidth, goalFlag.y + goalFlag.flagHeight);
    ctx.fill();

    // Coins
    ctx.fillStyle = "gold";
    ctx.strokeStyle = "#d4af37";

    for (const coin of coins) {

      const r = coin.size / 2;

      ctx.beginPath();
      ctx.arc(
        coin.x + r - camera.x,
        coin.y + r,
        r,
        0,
        Math.PI * 2
      );

      ctx.fill();
      ctx.stroke();
    }

    // Enemies
    for (const enemy of enemies) {

      const ex = enemy.x - camera.x;

      ctx.fillStyle = enemy.color;
      ctx.fillRect(ex, enemy.y, enemy.width, enemy.height);

      ctx.fillStyle = "white";

      ctx.beginPath();
      ctx.moveTo(ex + 4, enemy.y + 6);
      ctx.lineTo(ex + 13, enemy.y + 11);
      ctx.lineTo(ex + 11, enemy.y + 16);
      ctx.lineTo(ex + 3, enemy.y + 12);
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(ex + enemy.width - 4, enemy.y + 6);
      ctx.lineTo(ex + enemy.width - 13, enemy.y + 11);
      ctx.lineTo(ex + enemy.width - 11, enemy.y + 16);
      ctx.lineTo(ex + enemy.width - 3, enemy.y + 12);
      ctx.fill();

      ctx.fillStyle = "black";
      ctx.fillRect(ex + 7, enemy.y + 11, 3, 3);
      ctx.fillRect(ex + enemy.width - 10, enemy.y + 11, 3, 3);
    }

    // Player
    const rx = player.x - camera.x;

    ctx.fillStyle = player.color;
    ctx.fillRect(rx, player.y, player.width, player.height);

    ctx.fillStyle = "white";
    ctx.fillRect(rx + 8, player.y + 10, 8, 8);
    ctx.fillRect(rx + 24, player.y + 10, 8, 8);

    ctx.fillStyle = "black";
    ctx.fillRect(rx + 11, player.y + 13, 4, 4);
    ctx.fillRect(rx + 25, player.y + 13, 4, 4);

    ctx.fillStyle = "#4a0000";

    ctx.beginPath();
    ctx.arc(rx + 20, player.y + 26, 5, 0, Math.PI, false);
    ctx.fill();

    // HUD
    if (gameState !== "START") {

      ctx.font = "bold 28px sans-serif";
      ctx.lineWidth = 5;

      ctx.strokeStyle = "black";
      ctx.fillStyle = "white";

      ctx.textAlign = "left";
      ctx.strokeText("Score: " + score, 20, 20);
      ctx.fillText("Score: " + score, 20, 20);

      ctx.textAlign = "right";
      ctx.strokeText("Lives: " + lives, WIDTH - 20, 20);
      ctx.fillText("Lives: " + lives, WIDTH - 20, 20);
    }

    // Start screen
    if (gameState === "START") {

      ctx.fillStyle = "rgba(0,0,0,0.45)";
      ctx.fillRect(0, 0, WIDTH, HEIGHT);

      ctx.textAlign = "center";

      ctx.font = "bold 56px sans-serif";
      ctx.strokeStyle = "black";
      ctx.lineWidth = 8;

      ctx.strokeText("Super Square Adventure", WIDTH / 2, HEIGHT / 2 - 80);

      ctx.fillStyle = "white";
      ctx.fillText("Super Square Adventure", WIDTH / 2, HEIGHT / 2 - 80);

      ctx.font = "bold 24px sans-serif";

      ctx.strokeText("Press SPACE or JUMP to start", WIDTH / 2, HEIGHT / 2 + 60);

      ctx.fillStyle = "#ffeb3b";
      ctx.fillText("Press SPACE or JUMP to start", WIDTH / 2, HEIGHT / 2 + 60);
    }

    // Game over
    if (gameState === "GAME_OVER") {

      ctx.fillStyle = "rgba(0,0,0,0.55)";
      ctx.fillRect(0, 0, WIDTH, HEIGHT);

      ctx.textAlign = "center";

      ctx.font = "bold 64px sans-serif";
      ctx.strokeStyle = "black";
      ctx.lineWidth = 8;

      ctx.strokeText("GAME OVER", WIDTH / 2, HEIGHT / 2 - 20);

      ctx.fillStyle = "#ff3838";
      ctx.fillText("GAME OVER", WIDTH / 2, HEIGHT / 2 - 20);
    }

    // Win
    if (gameState === "WON") {

      ctx.fillStyle = "rgba(0,0,0,0.4)";
      ctx.fillRect(0, 0, WIDTH, HEIGHT);

      ctx.textAlign = "center";

      ctx.font = "bold 64px sans-serif";
      ctx.strokeStyle = "black";
      ctx.lineWidth = 8;

      ctx.strokeText("YOU WIN!", WIDTH / 2, HEIGHT / 2 - 40);

      ctx.fillStyle = "#f1c40f";
      ctx.fillText("YOU WIN!", WIDTH / 2, HEIGHT / 2 - 40);

      ctx.font = "bold 28px sans-serif";

      ctx.strokeText("Final Score: " + score, WIDTH / 2, HEIGHT / 2 + 30);

      ctx.fillStyle = "white";
      ctx.fillText("Final Score: " + score, WIDTH / 2, HEIGHT / 2 + 30);
    }
  }

  // Game loop
  function gameLoop() {

    update();
    draw();

    requestAnimationFrame(gameLoop);
  }

  // Start
  resetGame();
  gameLoop();
</script>

</body>
</html>
